name: Validate data files

on:
  push:
    paths:
      - "data/*.json"

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run validate script
        run: python .github/scripts/validate_data.py
